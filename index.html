<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1f3864"><title>Fantasy reports</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171f;--muted:#6b7280;--line:#e5e7eb;--accent:#1f3864}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--muted:#9aa3b2;--line:#2a2f3a;--accent:#8fb3ff}}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--muted:#9aa3b2;--line:#2a2f3a;--accent:#8fb3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:32px 16px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
a.btn{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:18px}
a.btn span{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
</style></head><body><main>
<h1>Fantasy reports</h1><div class="sub">Rebuilt by every scheduled refresh. Add a league page to your home screen.</div>
<a class="btn" href="lite/">Fantasy Lite<span>My Dicker Hurts · 12 teams</span></a>
<a class="btn" href="bfl/">The BFL<span>Sofia Gabay · 10 teams, 2 QB</span></a>
</main></body></html>
